appname = atlas_externo_servicio

httpport = 8082
runmode = prod

autorender = false
copyrequestbody = true
EnableDocs = true

parameterStore = ${PARAMETER_STORE}

ElasticsearchScheme=${ELASTICSEARCH_SCHEME}
ElasticsearchHost=${ELASTICSEARCH_HOST}
ElasticsearchPort=${ELASTICSEARCH_PORT}
ElasticsearchUsername=${ELASTICSEARCH_USERNAME}
ElasticsearchPassword=${ELASTICSEARCH_PASSWORD}

# Cloudflare Turnstile
TurnstileValidationMode=${TURNSTILE_VALIDATION_MODE}
TurnstileSecret=${TURNSTILE_SECRET}
TurnstileExpectedHostname=${TURNSTILE_EXPECTED_HOSTNAME}
TurnstileExpectedAction=${TURNSTILE_EXPECTED_ACTION}
TurnstileClearanceSecret=${TURNSTILE_CLEARANCE_SECRET}
TurnstileClearanceTTLSeconds=600
TurnstileCookieName=atlas_turnstile_clearance
TurnstileCookieSecure=${TURNSTILE_COOKIE_SECURE}
TurnstileDegradedSeconds=60
TurnstileVerifyMaxAttemptsPerMinute=10


# Detección de riesgo
RiskWindowSeconds=60
RiskBurstWindowSeconds=5
RiskMaxRequestsPerWindow=60
RiskMaxBurstRequests=12
RiskMaxUniquePathsPerWindow=30
RiskChallengeScore=35
RiskRechallengeScore=65
RiskBlockScore=80
